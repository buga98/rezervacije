services:
  app:
    image: lineaplus-rezervacije:latest
    build: .
    restart: unless-stopped
    env_file: .env
    network_mode: host
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3700/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s
  worker:
    image: lineaplus-rezervacije:latest
    build: .
    restart: unless-stopped
    env_file: .env
    network_mode: host
    command: ["npm", "run", "worker"]
    depends_on:
      app:
        condition: service_healthy
