name: Unpack initial source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and unpack production source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source.b64.* > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/source.tar.xz
          xz -t /tmp/source.tar.xz
          rm -rf /tmp/rezervacije-source
          mkdir -p /tmp/rezervacije-source
          tar -xJf /tmp/source.tar.xz -C /tmp/rezervacije-source
          cp -a /tmp/rezervacije-source/lineaplus-rezervacije/. .
          rm -rf .bootstrap source.tar.xz
          rm -f .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: initial multi-tenant booking platform"
          git push origin main
