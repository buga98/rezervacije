name: Deploy VPS

on:
  workflow_dispatch:
    inputs:
      run_seed:
        description: "Ponovno pokreni idempotentni seed"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: rezervacije-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$VPS_HOST" || { echo "Missing VPS_HOST"; exit 1; }
          test -n "$VPS_USER" || { echo "Missing VPS_USER"; exit 1; }
          test -n "$VPS_SSH_KEY" || { echo "Missing VPS_SSH_KEY"; exit 1; }

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy application
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RUN_SEED: ${{ inputs.run_seed }}
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" "$VPS_USER@$VPS_HOST" "RUN_SEED='$RUN_SEED' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          APP_DIR=/opt/rezervacije
          test -d "$APP_DIR/.git" || { echo "First install nije izvršen u $APP_DIR"; exit 1; }
          test -f "$APP_DIR/.env" || { echo "Nedostaje $APP_DIR/.env"; exit 1; }

          cd "$APP_DIR"
          git fetch origin main
          git reset --hard origin/main

          docker compose build --pull
          docker compose run --rm --no-deps app npx prisma migrate deploy
          if [[ "${RUN_SEED:-false}" == "true" ]]; then
            docker compose run --rm --no-deps app npm run db:seed
          fi
          docker compose up -d --remove-orphans

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3700/api/health; then
              echo
              echo "Deployment healthy"
              docker compose ps
              exit 0
            fi
            sleep 2
          done

          docker compose ps
          docker compose logs --tail=100 app
          exit 1
          REMOTE
