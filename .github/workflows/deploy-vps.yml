name: Deploy VPS

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_seed:
        description: "Ponovno pokreni idempotentni seed"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: rezervacije-production
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/buga98/rezervacije

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve deploy ref
        id: ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ] && [ -n "$VERIFIED_SHA" ]; then
            DEPLOY_REF="$VERIFIED_SHA"
          else
            DEPLOY_REF="main"
          fi
          echo "deploy_ref=$DEPLOY_REF" >> "$GITHUB_OUTPUT"
          echo "image_tag=${VERIFIED_SHA:-$CURRENT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout verified source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.deploy_ref }}

      - name: Validate deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$VPS_HOST" || { echo "Missing VPS_HOST"; exit 1; }
          test -n "$VPS_USER" || { echo "Missing VPS_USER"; exit 1; }
          test -n "$VPS_SSH_KEY" || { echo "Missing VPS_SSH_KEY"; exit 1; }

      - name: Build slim production images on GitHub
        env:
          IMAGE_TAG: ${{ steps.ref.outputs.image_tag }}
        run: |
          set -euo pipefail
          docker build --target app \
            -t "$IMAGE_NAME:app-$IMAGE_TAG" \
            -t "$IMAGE_NAME:app-latest" .
          docker build --target worker \
            -t "$IMAGE_NAME:worker-$IMAGE_TAG" \
            -t "$IMAGE_NAME:worker-latest" .
          docker images "$IMAGE_NAME" --format 'table {{.Repository}}\t{{.Tag}}\t{{.Size}}'

      - name: Publish slim images to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ steps.ref.outputs.image_tag }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE_NAME:app-$IMAGE_TAG"
          docker push "$IMAGE_NAME:app-latest"
          docker push "$IMAGE_NAME:worker-$IMAGE_TAG"
          docker push "$IMAGE_NAME:worker-latest"
          docker logout ghcr.io

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'echo "SSH OK: $(hostname)"'

      - name: Deploy slim images on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_REF: ${{ steps.ref.outputs.deploy_ref }}
          IMAGE_TAG: ${{ steps.ref.outputs.image_tag }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          RUN_SEED: ${{ github.event_name == 'workflow_dispatch' && inputs.run_seed || false }}
        run: |
          set -euo pipefail
          timeout 12m ssh -o ServerAliveInterval=20 -o ServerAliveCountMax=3 "$VPS_USER@$VPS_HOST" \
            "DEPLOY_REF='$DEPLOY_REF' IMAGE_TAG='$IMAGE_TAG' RUN_SEED='$RUN_SEED' GHCR_USER='$GHCR_USER' GHCR_TOKEN='$GHCR_TOKEN' bash -se" <<'REMOTE'
            set -Eeuo pipefail

            APP_DIR=/opt/rezervacije
            REPO_URL=https://github.com/buga98/rezervacije.git
            IMAGE_NAME=ghcr.io/buga98/rezervacije
            DOMAIN=rezervacije.lineaplusdev.com
            DB_NAME=rezervacije
            DB_USER=rezervacije_user
            SUPERADMIN_EMAIL=admin@lineaplusdev.com
            uid=$(id -u)
            gid=$(id -g)

            echo "[rezervacije] Deploying ref: $DEPLOY_REF"
            echo "[rezervacije] Using slim app/worker images for: $IMAGE_TAG"

            if [ ! -d "$APP_DIR" ]; then
              docker run --rm -v /opt:/host mariadb:11.4 sh -c "mkdir -p /host/rezervacije && chown $uid:$gid /host/rezervacije"
            fi

            if [ -d "$APP_DIR/.git" ]; then
              cd "$APP_DIR"
              git fetch origin main
              if [ "$DEPLOY_REF" = "main" ]; then
                git reset --hard origin/main
              else
                git fetch origin "$DEPLOY_REF"
                git reset --hard "$DEPLOY_REF"
              fi
              git clean -fd -e .env -e .initial-credentials
            else
              git clone --branch main "$REPO_URL" "$APP_DIR"
              cd "$APP_DIR"
              if [ "$DEPLOY_REF" != "main" ]; then
                git fetch origin "$DEPLOY_REF"
                git reset --hard "$DEPLOY_REF"
              fi
            fi

            FIRST_INSTALL=false
            if [ ! -f .env ]; then
              FIRST_INSTALL=true
              echo '[rezervacije] First install: creating MariaDB database and production environment'

              DB_PASS=$(openssl rand -hex 24)
              AUTH_SECRET=$(openssl rand -hex 48)
              CRON_SECRET=$(openssl rand -hex 32)
              SUPERADMIN_PASSWORD=$(openssl rand -hex 14)
              DEMO_OWNER_PASSWORD=$(openssl rand -hex 14)

              SQL="CREATE DATABASE IF NOT EXISTS \`$DB_NAME\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE USER IF NOT EXISTS '$DB_USER'@'127.0.0.1' IDENTIFIED BY '$DB_PASS'; ALTER USER '$DB_USER'@'127.0.0.1' IDENTIFIED BY '$DB_PASS'; CREATE USER IF NOT EXISTS '$DB_USER'@'localhost' IDENTIFIED BY '$DB_PASS'; ALTER USER '$DB_USER'@'localhost' IDENTIFIED BY '$DB_PASS'; GRANT ALL PRIVILEGES ON \`$DB_NAME\`.* TO '$DB_USER'@'127.0.0.1'; GRANT ALL PRIVILEGES ON \`$DB_NAME\`.* TO '$DB_USER'@'localhost'; FLUSH PRIVILEGES;"
              docker run --rm -v /run/mysqld:/run/mysqld mariadb:11.4 mariadb --protocol=socket -S /run/mysqld/mysqld.sock -uroot -e "$SQL"

              SMTP_HOST_VAL=$(grep -m1 '^SMTP_HOST=' /opt/sredito/.env 2>/dev/null | cut -d= -f2- || true)
              SMTP_PORT_VAL=$(grep -m1 '^SMTP_PORT=' /opt/sredito/.env 2>/dev/null | cut -d= -f2- || true)
              SMTP_SECURE_VAL=$(grep -m1 '^SMTP_SECURE=' /opt/sredito/.env 2>/dev/null | cut -d= -f2- || true)
              SMTP_USER_VAL=$(grep -m1 '^SMTP_USER=' /opt/sredito/.env 2>/dev/null | cut -d= -f2- || true)
              SMTP_PASS_VAL=$(grep -m1 '^SMTP_PASS=' /opt/sredito/.env 2>/dev/null | cut -d= -f2- || true)

              {
                printf '%s\n' 'NODE_ENV=production'
                printf 'APP_URL=https://%s\n' "$DOMAIN"
                printf 'DATABASE_URL=mysql://%s:%s@127.0.0.1:3306/%s\n' "$DB_USER" "$DB_PASS" "$DB_NAME"
                printf '%s\n' 'DB_POOL_SIZE=10'
                printf 'AUTH_SECRET=%s\n' "$AUTH_SECRET"
                printf 'CRON_SECRET=%s\n' "$CRON_SECRET"
                printf 'SUPERADMIN_EMAIL=%s\n' "$SUPERADMIN_EMAIL"
                printf 'SUPERADMIN_PASSWORD=%s\n' "$SUPERADMIN_PASSWORD"
                printf '%s\n' 'SEED_DEMO=true'
                printf 'DEMO_OWNER_PASSWORD=%s\n' "$DEMO_OWNER_PASSWORD"
                printf 'SMTP_HOST=%s\n' "$SMTP_HOST_VAL"
                printf 'SMTP_PORT=%s\n' "${SMTP_PORT_VAL:-587}"
                printf 'SMTP_SECURE=%s\n' "${SMTP_SECURE_VAL:-false}"
                printf 'SMTP_USER=%s\n' "$SMTP_USER_VAL"
                printf 'SMTP_PASS=%s\n' "$SMTP_PASS_VAL"
                printf '%s\n' 'SMTP_FROM="Linea+ Rezervacije <noreply@lineaplusdev.com>"'
                printf '%s\n' 'VAPID_PUBLIC_KEY='
                printf '%s\n' 'VAPID_PRIVATE_KEY='
                printf 'VAPID_SUBJECT=mailto:%s\n' "$SUPERADMIN_EMAIL"
                printf '%s\n' 'STRIPE_SECRET_KEY='
                printf '%s\n' 'NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY='
                printf '%s\n' 'TWILIO_ACCOUNT_SID='
                printf '%s\n' 'TWILIO_AUTH_TOKEN='
                printf '%s\n' 'TWILIO_SMS_FROM='
                printf '%s\n' 'TWILIO_WHATSAPP_FROM='
              } > .env

              {
                printf 'SuperAdmin email: %s\n' "$SUPERADMIN_EMAIL"
                printf 'SuperAdmin password: %s\n' "$SUPERADMIN_PASSWORD"
                printf '%s\n' 'Demo owner email: demo@lineaplusdev.com'
                printf 'Demo owner password: %s\n' "$DEMO_OWNER_PASSWORD"
              } > .initial-credentials
              chmod 600 .env .initial-credentials
            else
              echo '[rezervacije] Existing .env preserved'
            fi

            echo '[rezervacije] Clearing any stale deployment clients'
            pkill -f 'docker compose build --pull' 2>/dev/null || true
            pkill -f 'docker-buildx bake' 2>/dev/null || true
            pkill -f 'docker pull ghcr.io/buga98/rezervacije' 2>/dev/null || true
            sleep 2

            echo '[rezervacije] Pulling slim images from GHCR'
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE_NAME:app-$IMAGE_TAG"
            docker pull "$IMAGE_NAME:worker-$IMAGE_TAG"
            docker tag "$IMAGE_NAME:app-$IMAGE_TAG" lineaplus-rezervacije-app:latest
            docker tag "$IMAGE_NAME:worker-$IMAGE_TAG" lineaplus-rezervacije-worker:latest
            docker logout ghcr.io

            VAPID_CURRENT=$(grep -m1 '^VAPID_PUBLIC_KEY=' .env | cut -d= -f2- | tr -d '"' || true)
            if [ -z "$VAPID_CURRENT" ]; then
              echo '[rezervacije] Generating VAPID keys'
              mapfile -t VAPID_KEYS < <(docker run --rm lineaplus-rezervacije-worker:latest node -e "const k=require('web-push').generateVAPIDKeys();console.log(k.publicKey);console.log(k.privateKey)")
              VAPID_PUBLIC=${VAPID_KEYS[0]}
              VAPID_PRIVATE=${VAPID_KEYS[1]}
              sed -i "s|^VAPID_PUBLIC_KEY=.*|VAPID_PUBLIC_KEY=$VAPID_PUBLIC|" .env
              sed -i "s|^VAPID_PRIVATE_KEY=.*|VAPID_PRIVATE_KEY=$VAPID_PRIVATE|" .env
            fi

            echo '[rezervacije] Applying database migrations'
            docker compose run --rm --no-deps worker ./node_modules/.bin/prisma migrate deploy </dev/null

            if [ "$FIRST_INSTALL" = true ] || [ "${RUN_SEED:-false}" = true ]; then
              echo '[rezervacije] Seeding SuperAdmin and demo salon'
              docker compose run --rm --no-deps worker ./node_modules/.bin/tsx prisma/seed.ts </dev/null
            fi

            echo '[rezervacije] Starting app and notification worker'
            docker compose up -d --no-build --force-recreate --remove-orphans

            echo '[rezervacije] Verifying app health'
            HEALTHY=false
            for i in {1..40}; do
              if curl -fsS http://127.0.0.1:3700/api/health >/tmp/rezervacije-health.json; then
                HEALTHY=true
                break
              fi
              sleep 3
            done

            if [ "$HEALTHY" != true ]; then
              docker compose ps
              docker compose logs --tail=120 app worker
              exit 1
            fi

            cat /tmp/rezervacije-health.json
            echo
            sleep 8

            APP_CID=$(docker compose ps -q app)
            WORKER_CID=$(docker compose ps -q worker)
            test -n "$APP_CID" || { echo 'App container missing'; exit 1; }
            test -n "$WORKER_CID" || { echo 'Worker container missing'; exit 1; }

            WORKER_RUNNING=$(docker inspect -f '{{.State.Running}}' "$WORKER_CID")
            WORKER_RESTARTS=$(docker inspect -f '{{.RestartCount}}' "$WORKER_CID")
            echo "worker_running=$WORKER_RUNNING worker_restarts=$WORKER_RESTARTS"
            if [ "$WORKER_RUNNING" != true ] || [ "$WORKER_RESTARTS" -gt 0 ]; then
              docker compose logs --tail=120 worker
              exit 1
            fi

            docker compose ps
            docker compose logs --tail=20 worker
            if [ -f .initial-credentials ]; then
              echo 'INITIAL_CREDENTIALS_FILE=/opt/rezervacije/.initial-credentials'
            fi
          REMOTE

      - name: Public endpoint check
        continue-on-error: true
        run: |
          curl -LfsS --max-time 15 https://rezervacije.lineaplusdev.com/api/health
